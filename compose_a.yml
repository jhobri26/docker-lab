name: dockerexam
services:
  frontend:
    image: dockerexam-frontend:local
    build: ./frontend
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18081:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [exam]
    restart: unless-stopped

  frontend-demo:
    image: dockerexam-frontend:local
    ports:
      - "127.0.0.1:18082:80"
    depends_on:
      frontend:
        condition: service_healthy
    networks: [exam]
    restart: unless-stopped

  api:
    image: dockerexam-api:local
    build: ./backend
    environment:
      Database__Server: sqlserver
      Database__Name: DockerExam
      Database__PasswordFile: /run/secrets/db_password
      Redis__Host: redis
      EvidencePath: /data/evidence
    secrets: [db_password]
    volumes: [evidence-data:/data/evidence]
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Exam.Api.dll", "--healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks: [exam]
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    entrypoint: ["/bin/bash", "-c", "export MSSQL_SA_PASSWORD=$$(cat /run/secrets/db_password); exec /opt/mssql/bin/sqlservr"]
    secrets: [db_password]
    volumes: [sql-data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$(cat /run/secrets/db_password)\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [exam]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [exam]
    restart: unless-stopped

networks:
  exam:
    name: dockerexam-net
    labels:
      dockerexam.lab: "true"
volumes:
  sql-data:
    name: dockerexam-sql-data
  evidence-data:
    name: dockerexam-evidence-data
  redis-data:
    name: dockerexam-redis-data
secrets:
  db_password:
    file: ./secrets/db_password.txt
