# Caso 09: secret por archivo y persistencia al eliminar/recrear contenedores.
# Crear manualmente secrets/caso9_db_password.txt antes del primer arranque.
# Seguir guide.md: conservar contraseña y volúmenes durante toda la demostración.
name: dockerexam-caso9
services:
  frontend:
    image: dockerexam-frontend:local-caso9
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18190:80"
      - "127.0.0.1:18191:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [exam]
    restart: unless-stopped

  frontend-demo:
    image: dockerexam-frontend:local-caso9
    ports:
      - "127.0.0.1:18192:80"
    depends_on:
      frontend:
        condition: service_healthy
    networks: [exam]
    restart: unless-stopped

  api:
    image: dockerexam-api:local-caso9
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      Database__Server: sqlserver
      Database__Name: DockerExam
      Database__PasswordFile: /run/secrets/db_password
      Redis__Host: redis
      EvidencePath: /data/evidence
    secrets: [db_password]
    volumes: [evidence-data:/data/evidence]
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Exam.Api.dll", "--healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks: [exam]
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    entrypoint: ["/bin/bash", "-c", "export MSSQL_SA_PASSWORD=$$(cat /run/secrets/db_password); exec /opt/mssql/bin/sqlservr"]
    secrets: [db_password]
    volumes: [sql-data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$(cat /run/secrets/db_password)\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [exam]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [exam]
    restart: unless-stopped

networks:
  exam:
    name: dockerexam-caso9-net
    labels:
      dockerexam.lab: "true"
volumes:
  sql-data:
    name: dockerexam-caso9-sql-data
  evidence-data:
    name: dockerexam-caso9-evidence-data
  redis-data:
    name: dockerexam-caso9-redis-data
secrets:
  db_password:
    file: ./secrets/caso9_db_password.txt
